<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>KS MLBB Cyber Toolkit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="logo-box">
    <img src="logo.png" class="logo">
  </div>

  <h1 class="glitch" data-text="KS CYBER TOOLKIT">KS CYBER TOOLKIT</h1>
  <p class="subtitle">⚡ Elite Cyber Gaming Tools ⚡</p>

  <div class="menu">
    <button onclick="showSection('wr')">⚙ Hitung WR</button>
    <button onclick="showSection('target')">🎯 Target WR</button>
    <button onclick="showSection('hero')">🎮 Random Hero</button>
    <button onclick="showSection('mlbb')">🔎 Cek ID MLBB</button>
  </div>

  <!-- WR -->
  <div class="section" id="wr">
    <h2>⚙ Hitung Menang & Kalah</h2>
    <input type="number" id="wrInput" placeholder="Winrate (%)">
    <input type="number" id="matchInput" placeholder="Total Match">
    <button onclick="hitungWR()">Hitung</button>
    <div class="result" id="wrResult"></div>
  </div>

  <!-- TARGET -->
  <div class="section" id="target">
    <h2>🎯 Target Winrate</h2>
    <input type="number" id="wrNow" placeholder="WR Sekarang (%)">
    <input type="number" id="matchNow" placeholder="Total Match">
    <input type="number" id="wrTarget" placeholder="WR Target (%)">
    <button onclick="targetWR()">Hitung</button>
    <div class="result" id="targetResult"></div>
  </div>

  <!-- RANDOM HERO -->
  <div class="section" id="hero">
    <h2>🎮 Random Hero MLBB</h2>

    <select id="role">
      <option value="all">All Role</option>
      <option value="tank">Tank</option>
      <option value="fighter">Fighter</option>
      <option value="assassin">Assassin</option>
      <option value="mage">Mage</option>
      <option value="marksman">Marksman</option>
      <option value="support">Support</option>
    </select>

    <textarea id="players" placeholder="Nama pemain (1 per baris)"></textarea>
    <button onclick="randomHero()">🎰 Generate Hero</button>
    <div class="result" id="heroResult"></div>
  </div>

  <!-- CEK ID MLBB -->
  <div class="section" id="mlbb">
    <h2>🔎 CEK ID & SERVER MLBB</h2>

    <div class="ml-row">
      <input type="number" id="mlID" placeholder="User ID">
      <input type="number" id="mlServer" placeholder="Server">
    </div>

    <button onclick="cekIDML()">CEK SEKARANG</button>
    <div class="result" id="mlResult"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
